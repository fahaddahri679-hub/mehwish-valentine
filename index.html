<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Question 💖</title>
<style>
    body{
        text-align:center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#ff9a9e,#fad0c4);
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        color:#fff;
    }

    h1{
        font-size:40px;
        margin-bottom:30px;
        text-shadow:2px 2px 10px rgba(0,0,0,0.2);
    }

    button{
        padding:15px 30px;
        font-size:18px;
        border:none;
        border-radius:30px;
        margin:10px;
        cursor:pointer;
        transition:0.3s;
    }

    #yes{
        background:#4CAF50;
        color:white;
    }

    #no{
        background:#ff4d4d;
        color:white;
    }

    button:hover{
        transform:scale(1.1);
    }
</style>
</head>
<body>

<h1 id="question">Will you be my Valentine? 💖</h1>

<div id="buttons">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 💔</button>
</div>

<script>
let noCount = 0;

const messages = [
    "Are you sure? 😢",
    "Really sure? 🥺",
    "It will be bad for you 😤 Are you sure?",
    "Think again please 😭",
    "Last chance... sure? 😶",
    "Don't break my heart 💔 Are you sure?"
];

document.getElementById("no").onclick = function(){
    noCount++;
    document.getElementById("question").innerText =
        messages[noCount % messages.length];
};

document.getElementById("yes").onclick = function(){
    document.body.innerHTML = `
        <h1 style="font-size:50px">
            Loveee you soooo much soni byti 💕😘
        </h1>
    `;
};
</script>

</body>
</html>
